name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The layout tests (web:test-layout) measure pages in a real browser.
      - run: npx playwright install --with-deps chromium

      - run: npx nx format:check --base=origin/main --head=HEAD
        if: github.event_name == 'pull_request'

      - run: npx nx run-many -t lint test build

  database:
    # Pinned: ubuntu-latest moved past 24.04 and no longer carries postgresql-16.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 >/dev/null
      - name: Migrations and RLS tests
        # The postgres user cannot read the runner's home on 24.04, so the
        # test runs from a world-readable copy.
        run: |
          cp -r "$GITHUB_WORKSPACE" /tmp/repo
          chmod -R a+rX /tmp/repo
          sudo -u postgres PGBIN=/usr/lib/postgresql/16/bin bash /tmp/repo/tools/db-test.sh

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function tests and type-check
        working-directory: supabase/functions
        run: |
          deno task test
          deno task check
