<a class="jb-skip-link" href="#main">Skip to content</a>

@if (auth.status() === 'loading') {
<div class="grid min-h-dvh place-items-center" role="status">
  <jb-logo class="jb-boot" [wordmark]="false" [size]="44" />
  <span class="sr-only">Loading Jobbotix</span>
</div>
} @else if (auth.isSignedIn()) {
<div class="jb-shell" [attr.data-rail]="rail()">
  <jb-sidebar
    class="hidden md:block print:hidden"
    [rail]="rail()"
    (signOut)="signOut()"
  />
  <div class="min-w-0">
    <jb-top-bar [title]="pageTitle()" [back]="back()" [showAdd]="showAdd()" />
    @if (!shell.online()) {
    <p class="jb-offline print:hidden" role="status">
      <jb-icon name="wifi-off" [size]="16" />
      You're offline. Changes won't save until the connection is back.
    </p>
    }
    <main id="main" class="jb-page" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
<jb-tab-bar
  class="md:hidden print:hidden"
  [moreActive]="moreActive()"
  (more)="shell.moreOpen.set(true)"
/>
<jb-more-sheet (signOut)="signOut()" />
<jb-command-palette />
} @else {
<header class="jb-public-header print:hidden">
  <a
    routerLink="/"
    class="rounded-control no-underline"
    aria-label="Jobbotix home"
  >
    <jb-logo />
  </a>
  <div class="flex items-center gap-2">
    <jb-theme-switch />
    @if (!onAuthPage()) {
    <a jbButton routerLink="/login">Sign in</a>
    }
  </div>
</header>
<main id="main" class="jb-page jb-page-public" tabindex="-1">
  <router-outlet />
</main>
}

<jb-toast-host class="print:hidden" />
<jb-confirm-host />
